# Named model mounts under /tinfoil/models need cvmimage 0.12.0 or newer.
cvm-version: 0.14.15
# Four inference worker processes of 8 threads each (dispatched least-busy
# by the gateway), so concurrent callers get separate processes instead of
# queueing. A shared semaphore was measured to serialize them (each
# concurrent request ran ~2x slower with no throughput gain); 4x8 measured
# 3.8x throughput at 4 in-flight with ~7% latency cost.
cpus: 32
memory: 65536 # should be 16384 (16GB); bumped to match medium_1d_new hardware platform for attestation
gpus: 0

models:
  - name: "privacy-filter"
    repo: "openai/privacy-filter@7ffa9a043d54d1be65afb281eddf0ffbe629385b"
    mpk: "d8de260d205c89df009794749bb1d463e06c8b560a989dc8999fc3f7a77a0cb9_17419419648_3892cd2f-a06e-5aee-8276-93140b9f06ec"

containers:
  - name: "privacy-filter"
    models: ["privacy-filter"]
    image: "ghcr.io/tinfoilsh/confidential-pii-cpu@sha256:68b9ae91855d8020b83eb7362bd1632b5c053bc88611d55c4fcd745ca172c5f9"
    restart: always
    networks: [billing]
    env:
      - OPF_CHECKPOINT: "/tinfoil/models/privacy-filter/original"
      - OPF_DEVICE: "cpu"
      - OPF_NUM_THREADS: "8"
      - OPF_MAX_CONCURRENCY: "1"
      - OPF_WORKERS: "4"
      # Long inputs are cut into overlapping windows that the gateway's
      # /forward queue spreads across every worker, fairly per caller. The
      # overlap must cover the model's receptive field (8 layers x 128 =
      # 1024; enforced from the checkpoint config at startup) so chunked
      # scores equal one long pass exactly. Stride 4096: +50% compute on
      # long inputs, none on inputs that fit one window.
      - OPF_WINDOW_TOKENS: "6144"
      - OPF_WINDOW_OVERLAP: "1024"
      - OPF_FORWARD_URL: "http://127.0.0.1:8001/forward"
      # 503 means "cannot drain", not "someone sent a big document": a 4 MiB
      # request is ~250 windows and must succeed.
      - OPF_MAX_QUEUED_WINDOWS: "4096"
      - OPF_WINDOW_TIMEOUT_SECONDS: "5"
      - OPF_MAX_REQUEST_SECONDS: "900"
      # Per-dispatch wedge detector; a worker that blows it is marked unhealthy.
      - OPF_FORWARD_TIMEOUT_SECONDS: "30"
      # Short requests (<= OPF_SHORT_REQUEST_TOKENS, default one window) go
      # first; long windows are held when the k-th soonest-freeing other
      # lane is not predicted free within horizon k ("" or "0" disables).
      # ARMED_SECONDS > 0 applies the rule only after recent short traffic.
      - OPF_SHORT_LANE_HORIZONS: "0.5,1.5"
      - OPF_SHORT_LANE_ARMED_SECONDS: "30"
      - OPF_MS_PER_TOKEN: "0.5"
    secrets:
      - METRICS_API_KEY
      - USAGE_REPORTER_SECRET
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=2g,mode=0700,exec
    command: ["/usr/local/bin/privacy-filter"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 5m

# Usage events are posted to the control plane; without egress every batch
# is dropped and filter requests go unbilled.
networks:
  billing:
    egress: allowlist
    allow:
      - api.tinfoil.sh

shim:
  upstream-port: 8001
  authenticated: true
  authenticated-endpoints:
    - /redact
    - /metrics
  paths:
    - /redact
    - /health
    - /metrics
